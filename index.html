<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laboratorio TFG · Liderazgo Formal e Informal y Cohesión (U14 Preferente)</title>
  <style>
    /* ==========================================================================
       PALETA INSTITUCIONAL CLUB ATLÈTIC SEGRE (ROJO · NEGRO · BLANCO)
       100% CSS NATIVO · CERO DEPENDENCIAS EXTERNAS
       ========================================================================== */
    :root {
      --segre-black: #090d16;
      --segre-black-soft: #18181b;
      --segre-red: #dc2626;
      --segre-red-hover: #b91c1c;
      --segre-red-dark: #991b1b;
      --segre-red-tint: #fef2f2;
      --segre-red-border: #fecaca;
      --segre-white: #ffffff;
      --segre-canvas: #f4f4f5;
      --segre-subtle: #fafafa;
      --segre-border: #e4e4e7;
      --segre-border-strong: #d4d4d8;
      --segre-text: #090d16;
      --segre-text-secondary: #3f3f46;
      --segre-text-muted: #71717a;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow-xs: 0 1px 2px rgba(9, 13, 22, 0.06);
      --shadow-sm: 0 4px 14px rgba(9, 13, 22, 0.08);
      --shadow-lg: 0 20px 44px rgba(9, 13, 22, 0.22);

      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background-color: var(--segre-canvas);
      color: var(--segre-text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Cabecera Oficial Atlètic Segre */
    .app-header {
      background-color: var(--segre-black);
      color: var(--segre-white);
      border-bottom: 4px solid var(--segre-red);
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand-title {
      margin: 5px 0 0 0;
      font-size: 1.06rem;
      font-weight: 800;
      letter-spacing: -0.015em;
      color: var(--segre-white);
    }

    .brand-sub {
      margin: 2px 0 0 0;
      font-size: 0.77rem;
      color: #d4d4d8;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.69rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .pill-red {
      background-color: var(--segre-red);
      color: var(--segre-white);
    }

    .pill-black {
      background-color: var(--segre-black);
      color: var(--segre-white);
      border: 1px solid #3f3f46;
    }

    .pill-white-outline {
      background-color: var(--segre-white);
      color: var(--segre-black);
      border: 1.5px solid var(--segre-black);
    }

    .pill-neutral {
      background-color: var(--segre-canvas);
      color: var(--segre-black);
      border: 1px solid var(--segre-border-strong);
    }

    /* Barra de Navegación (6 Pestañas) */
    .nav-bar {
      background-color: var(--segre-white);
      border-bottom: 1.5px solid var(--segre-border);
      overflow-x: auto;
    }

    .nav-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 9px 20px;
      display: flex;
      gap: 6px;
      min-width: max-content;
    }

    .tab-btn {
      appearance: none;
      border: 1.5px solid transparent;
      background: transparent;
      color: var(--segre-text-secondary);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }

    .tab-btn:hover {
      background-color: var(--segre-canvas);
      color: var(--segre-black);
    }

    .tab-btn.active {
      background-color: var(--segre-red);
      color: var(--segre-white);
      border-color: var(--segre-red);
    }

    /* Contenedor y Rejillas */
    .main-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px 20px 68px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card {
      background-color: var(--segre-white);
      border: 1px solid var(--segre-border);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-xs);
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--segre-border);
    }

    .card-title {
      margin: 0;
      font-size: 1.04rem;
      font-weight: 800;
      color: var(--segre-black);
    }

    .card-subtitle {
      margin: 4px 0 0 0;
      font-size: 0.8rem;
      color: var(--segre-text-muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    @media (max-width: 1000px) {
      .grid-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 720px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
    }

    /* Botones Estricto Rojo / Negro / Blanco */
    .btn {
      appearance: none;
      border: 1.5px solid transparent;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 9px 15px;
      min-height: 38px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease, transform 0.05s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-red {
      background-color: var(--segre-red);
      color: var(--segre-white);
      border-color: var(--segre-red);
    }

    .btn-red:hover:not(:disabled) {
      background-color: var(--segre-red-hover);
      border-color: var(--segre-red-hover);
    }

    .btn-black {
      background-color: var(--segre-black);
      color: var(--segre-white);
      border-color: var(--segre-black);
    }

    .btn-black:hover:not(:disabled) {
      background-color: var(--segre-black-soft);
    }

    .btn-outline-black {
      background-color: var(--segre-white);
      color: var(--segre-black);
      border-color: var(--segre-black);
    }

    .btn-outline-black:hover:not(:disabled) {
      background-color: var(--segre-canvas);
    }

    .btn-outline-red {
      background-color: var(--segre-white);
      color: var(--segre-red);
      border-color: var(--segre-red);
    }

    .btn-outline-red:hover:not(:disabled) {
      background-color: var(--segre-red-tint);
    }

    .btn-sm {
      padding: 6px 11px;
      min-height: 32px;
      font-size: 0.75rem;
    }

    /* Campos de Formulario */
    label.field-label {
      display: block;
      font-size: 0.71rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--segre-text-secondary);
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 9px 12px;
      font-family: var(--font-sans);
      font-size: 0.84rem;
      color: var(--segre-black);
      background-color: var(--segre-white);
      border: 1.5px solid var(--segre-border-strong);
      border-radius: var(--radius-sm);
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--segre-black);
      box-shadow: 0 0 0 3px rgba(9, 13, 22, 0.09);
    }

    /* Alertas Institucionales (Rojo / Negro / Zinc) */
    .notice {
      padding: 13px 16px;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      line-height: 1.48;
      border: 1.5px solid;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .notice-red {
      background-color: var(--segre-red-tint);
      border-color: var(--segre-red-border);
      color: var(--segre-red-dark);
    }

    .notice-black {
      background-color: var(--segre-black);
      border-color: var(--segre-black);
      color: var(--segre-white);
    }

    .notice-zinc {
      background-color: var(--segre-canvas);
      border-color: var(--segre-border-strong);
      color: var(--segre-black);
    }

    /* Tablas */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--segre-border);
      border-radius: var(--radius-md);
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: left;
    }

    table.data-table th {
      background-color: var(--segre-black);
      color: var(--segre-white);
      font-size: 0.69rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 10px 12px;
      white-space: nowrap;
    }

    table.data-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--segre-border);
      vertical-align: middle;
    }

    table.data-table tr:last-child td {
      border-bottom: none;
    }

    table.data-table tbody tr:hover {
      background-color: var(--segre-subtle);
    }

    .text-center { text-align: center !important; }
    .font-bold { font-weight: 700; }
    .font-black { font-weight: 800; }

    /* Selector Global de Oleada */
    .wave-strip {
      background-color: var(--segre-white);
      border: 1px solid var(--segre-border);
      border-radius: var(--radius-lg);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .wave-pills {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .wave-chip {
      padding: 7px 13px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--segre-black);
      background-color: var(--segre-white);
      color: var(--segre-black);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .wave-chip.active {
      background-color: var(--segre-red);
      color: var(--segre-white);
      border-color: var(--segre-red);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* ==========================================================================
       ENCUESTA MÓVIL ANTI-CURIOSOS ("VOTADO" SUSTITUYE AL NOMBRE + "NINGUNO")
       ========================================================================== */
    .survey-shell {
      max-width: 560px;
      margin: 12px auto;
      background-color: var(--segre-white);
      border: 1.5px solid var(--segre-black);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .survey-top {
      background-color: var(--segre-black);
      color: var(--segre-white);
      padding: 18px 22px;
      border-bottom: 3px solid var(--segre-red);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: var(--segre-border);
    }

    .progress-fill {
      height: 100%;
      background-color: var(--segre-red);
      transition: width 0.2s ease;
    }

    .ninguno-btn {
      appearance: none;
      width: 100%;
      min-height: 46px;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--segre-black);
      background-color: var(--segre-white);
      color: var(--segre-black);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .ninguno-btn.is-active {
      background-color: var(--segre-black);
      color: var(--segre-white);
    }

    .nomination-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    @media (max-width: 440px) {
      .nomination-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Botón anti-miradas laterales: estilo uniforme blanco/negro y texto "VOTADO" en lugar del nombre */
    .anti-peek-btn {
      appearance: none;
      width: 100%;
      min-height: 48px;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--segre-black);
      background-color: var(--segre-white);
      color: var(--segre-black);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: none;
    }

    .anti-peek-btn:hover,
    .anti-peek-btn:focus,
    .anti-peek-btn.is-voted {
      background-color: var(--segre-white);
      border-color: var(--segre-black);
      color: var(--segre-black);
      box-shadow: none;
    }

    .anti-peek-btn.is-voted {
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .likert-row {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 5px;
    }

    .likert-btn {
      appearance: none;
      min-height: 44px;
      padding: 10px 0;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--segre-black);
      background-color: var(--segre-white);
      color: var(--segre-black);
      font-family: var(--font-mono);
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }

    .likert-btn.selected {
      background-color: var(--segre-red);
      color: var(--segre-white);
      border-color: var(--segre-red);
    }

    .optout-btn {
      width: 100%;
      min-height: 42px;
      margin-top: 10px;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1.5px dashed var(--segre-black);
      background-color: var(--segre-white);
      color: var(--segre-black);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .optout-btn.selected {
      background-color: var(--segre-black);
      color: var(--segre-white);
      border-style: solid;
    }

    /* Sociograma SVG */
    .sociogram-box {
      border: 1px solid var(--segre-border);
      border-radius: var(--radius-md);
      background-color: var(--segre-white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    /* Toast & Modal */
    .toast-banner {
      position: fixed;
      bottom: 20px;
      right: 20px;
      max-width: 450px;
      z-index: 100;
      padding: 13px 16px;
      border-radius: var(--radius-md);
      color: var(--segre-white);
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      border: 1.5px solid var(--segre-white);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(9, 13, 22, 0.72);
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-dialog {
      background-color: var(--segre-white);
      border-radius: var(--radius-lg);
      max-width: 490px;
      width: 100%;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      border: 2px solid var(--segre-black);
    }
  </style>
</head>
<body>
  <div id="app"></div>

    const ALL_CODE_POOL = Array.from({ length: MAX_PLAYERS }, (_, i) => `J${String(i + 1).padStart(2, "0")}`);

    /* ==========================================================================
       2. GENERADOR OFFLINE PURO EN JS DE CÓDIGOS QR ISO/IEC 18004 EN SVG (V1-V9)
       ========================================================================== */
    const OfflineQR = (() => {
      const VERSIONS = [
        null,
        { size: 21, dataBytes: 19, blocks: [[1, 19, 7]] },
        { size: 25, dataBytes: 34, blocks: [[1, 34, 10]] },
        { size: 29, dataBytes: 55, blocks: [[1, 55, 15]] },
        { size: 33, dataBytes: 80, blocks: [[1, 80, 20]] },
        { size: 37, dataBytes: 108, blocks: [[1, 108, 26]] },
        { size: 41, dataBytes: 136, blocks: [[2, 68, 18]] },
        { size: 45, dataBytes: 156, blocks: [[2, 78, 20]] },
        { size: 49, dataBytes: 194, blocks: [[2, 97, 24]] },
        { size: 53, dataBytes: 232, blocks: [[2, 116, 30]] }
      ];

      const ALIGN_COORDS = [
        null,
        [],
        [6, 18],
        [6, 22],
        [6, 26],
        [6, 30],
        [6, 34],
        [6, 22, 38],
        [6, 24, 42],
        [6, 26, 46]
      ];

      const EXP = new Uint8Array(512);
      const LOG = new Uint8Array(256);
      let val = 1;
      for (let i = 0; i < 255; i++) {
        EXP[i] = val;
        LOG[val] = i;
        val = (val << 1) ^ (val & 0x80 ? 0x11d : 0);
      }
      for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];

      function gfMul(a, b) {
        if (a === 0 || b === 0) return 0;
        return EXP[LOG[a] + LOG[b]];
      }

      function rsGenPoly(ecLen) {
        let poly = [1];
        for (let i = 0; i < ecLen; i++) {
          const next = new Array(poly.length + 1).fill(0);
          for (let j = 0; j < poly.length; j++) {
            next[j] ^= poly[j];
            next[j + 1] ^= gfMul(poly[j], EXP[i]);
          }
          poly = next;
        }
        return poly;
      }

      function rsCompute(data, ecLen) {
        const gen = rsGenPoly(ecLen);
        const rem = new Array(ecLen).fill(0);
        for (let i = 0; i < data.length; i++) {
          const factor = data[i] ^ rem[0];
          rem.shift();
          rem.push(0);
          for (let j = 0; j < ecLen; j++) {
            rem[j] ^= gfMul(gen[j + 1], factor);
          }
        }
        return rem;
      }

      function buildMatrix(text) {
        const utf8 = Array.from(new TextEncoder().encode(text));
        let ver = 1;
        while (ver <= 9) {
          if (VERSIONS[ver].dataBytes >= utf8.length + 2) break;
          ver++;
        }
        if (ver > 9) {
          ver = 9;
          utf8.length = VERSIONS[9].dataBytes - 2;
        }

        const spec = VERSIONS[ver];
        const bits = [];
        const pushBits = (num, len) => {
          for (let i = len - 1; i >= 0; i--) bits.push((num >>> i) & 1);
        };

        pushBits(0b0100, 4);
        pushBits(utf8.length, 8);
        utf8.forEach(b => pushBits(b, 8));
        pushBits(0, Math.min(4, spec.dataBytes * 8 - bits.length));
        while (bits.length % 8 !== 0) bits.push(0);

        const codewords = [];
        for (let i = 0; i < bits.length; i += 8) {
          let byte = 0;
          for (let j = 0; j < 8; j++) byte = (byte << 1) | bits[i + j];
          codewords.push(byte);
        }
        const pad = [0xec, 0x11];
        let pIdx = 0;
        while (codewords.length < spec.dataBytes) {
          codewords.push(pad[pIdx % 2]);
          pIdx++;
        }

        const dataBlocks = [];
        const ecBlocks = [];
        let cursor = 0;
        spec.blocks.forEach(([count, dLen, eLen]) => {
          for (let b = 0; b < count; b++) {
            const slice = codewords.slice(cursor, cursor + dLen);
            cursor += dLen;
            dataBlocks.push(slice);
            ecBlocks.push(rsCompute(slice, eLen));
          }
        });

        const interleaved = [];
        const maxDataLen = Math.max(...dataBlocks.map(b => b.length));
        for (let i = 0; i < maxDataLen; i++) {
          dataBlocks.forEach(b => { if (i < b.length) interleaved.push(b[i]); });
        }
        const maxEcLen = Math.max(...ecBlocks.map(b => b.length));
        for (let i = 0; i < maxEcLen; i++) {
          ecBlocks.forEach(b => { if (i < b.length) interleaved.push(b[i]); });
        }

        const n = spec.size;
        const mod = Array.from({ length: n }, () => new Array(n).fill(0));
        const isFunc = Array.from({ length: n }, () => new Array(n).fill(false));
        const setFunc = (r, c, v) => {
          if (r >= 0 && r < n && c >= 0 && c < n) {
            mod[r][c] = v ? 1 : 0;
            isFunc[r][c] = true;
          }
        };

        const placeFinder = (r0, c0) => {
          for (let dr = -1; dr <= 7; dr++) {
            for (let dc = -1; dc <= 7; dc++) {
              const inBox = dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6;
              const border = dr === 0 || dr === 6 || dc === 0 || dc === 6;
              const core = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
              setFunc(r0 + dr, c0 + dc, inBox && (border || core));
            }
          }
        };
        placeFinder(0, 0);
        placeFinder(0, n - 7);
        placeFinder(n - 7, 0);

        const aLocs = ALIGN_COORDS[ver];
        for (let i = 0; i < aLocs.length; i++) {
          for (let j = 0; j < aLocs.length; j++) {
            const r = aLocs[i], c = aLocs[j];
            if (isFunc[r][c]) continue;
            for (let dr = -2; dr <= 2; dr++) {
              for (let dc = -2; dc <= 2; dc++) {
                const dark = Math.abs(dr) === 2 || Math.abs(dc) === 2 || (dr === 0 && dc === 0);
                setFunc(r + dr, c + dc, dark);
              }
            }
          }
        }

        for (let i = 8; i < n - 8; i++) {
          if (!isFunc[6][i]) setFunc(6, i, i % 2 === 0);
          if (!isFunc[i][6]) setFunc(i, 6, i % 2 === 0);
        }

        setFunc(n - 8, 8, 1);
        for (let i = 0; i < 9; i++) {
          if (!isFunc[8][i]) setFunc(8, i, 0);
          if (!isFunc[i][8]) setFunc(i, 8, 0);
        }
        for (let i = 0; i < 8; i++) {
          if (!isFunc[8][n - 1 - i]) setFunc(8, n - 1 - i, 0);
          if (!isFunc[n - 1 - i][8]) setFunc(n - 1 - i, 8, 0);
        }

        if (ver >= 7) {
          const VER_BITS = { 7: 0x07c94, 8: 0x085bc, 9: 0x09a99 };
          const vBits = VER_BITS[ver];
          for (let i = 0; i < 18; i++) {
            const bit = (vBits >>> i) & 1;
            const a = Math.floor(i / 3);
            const b = n - 11 + (i % 3);
            setFunc(a, b, bit);
            setFunc(b, a, bit);
          }
        }

        const bitStream = [];
        interleaved.forEach(byte => {
          for (let b = 7; b >= 0; b--) bitStream.push((byte >>> b) & 1);
        });

        let bitIdx = 0;
        let upward = true;
        for (let right = n - 1; right >= 1; right -= 2) {
          if (right === 6) right = 5;
          for (let step = 0; step < n; step++) {
            const r = upward ? n - 1 - step : step;
            for (let dx = 0; dx < 2; dx++) {
              const c = right - dx;
              if (!isFunc[r][c]) {
                const raw = bitIdx < bitStream.length ? bitStream[bitIdx++] : 0;
                mod[r][c] = raw ^ ((r + c) % 2 === 0 ? 1 : 0);
              }
            }
          }
          upward = !upward;
        }

        const fmt = 0x77c4;
        const fmtBits = [];
        for (let i = 14; i >= 0; i--) fmtBits.push((fmt >>> i) & 1);
        const c1 = [
          [8, 0], [8, 1], [8, 2], [8, 3], [8, 4], [8, 5], [8, 7], [8, 8],
          [7, 8], [5, 8], [4, 8], [3, 8], [2, 8], [1, 8], [0, 8]
        ];
        const c2 = [
          [n - 1, 8], [n - 2, 8], [n - 3, 8], [n - 4, 8], [n - 5, 8], [n - 6, 8], [n - 7, 8],
          [8, n - 8], [8, n - 7], [8, n - 6], [8, n - 5], [8, n - 4], [8, n - 3], [8, n - 2], [8, n - 1]
        ];
        for (let i = 0; i < 15; i++) {
          mod[c1[i][0]][c1[i][1]] = fmtBits[i];
          mod[c2[i][0]][c2[i][1]] = fmtBits[i];
        }

        return mod;
      }

      return {
        toSVG(text, pxSize = 158) {
          const matrix = buildMatrix(text);
          const n = matrix.length;
          const quiet = 3;
          const total = n + quiet * 2;
          let rects = "";
          for (let r = 0; r < n; r++) {
            for (let c = 0; c < n; c++) {
              if (matrix[r][c] === 1) {
                rects += `<rect x="${c + quiet}" y="${r + quiet}" width="1" height="1" />`;
              }
            }
          }
          return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${pxSize}" height="${pxSize}" shape-rendering="crispEdges" style="background:#ffffff;border:1.5px solid #090d16;border-radius:12px;display:block"><g fill="#090d16">${rects}</g></svg>`;
        }
      };
    })();

    /* ==========================================================================
       3. UTILIDADES CRIPTOGRÁFICAS Y SHUFFLE NO SECUENCIAL
       ========================================================================== */
    function cryptoShuffle(list) {
      const arr = [...list];
      const rnd = new Uint32Array(arr.length);
      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(rnd);
      } else {
        let s = MONTE_CARLO_SEED;
        for (let i = 0; i < arr.length; i++) {
          s = (s * 1664525 + 1013904223) >>> 0;
          rnd[i] = s;
        }
      }
      for (let i = arr.length - 1; i > 0; i--) {
        const j = rnd[i] % (i + 1);
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function computeSHA256(text) {
      if (window.crypto && window.crypto.subtle) {
        const buf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
      }
      let h1 = 0x811c9dc5, h2 = 0x01000193;
      for (let i = 0; i < text.length; i++) {
        h1 ^= text.charCodeAt(i);
        h1 = Math.imul(h1, 0x01000193);
        h2 ^= text.charCodeAt(i) + i;
        h2 = Math.imul(h2, 0x85ebca6b);
      }
      return `${(h1 >>> 0).toString(16).padStart(8, "0")}${(h2 >>> 0).toString(16).padStart(8, "0")}`;
    }

    function encodeTokenBase64Url(obj) {
      const jsonStr = JSON.stringify(obj);
      const utf8Bytes = new TextEncoder().encode(jsonStr);
      let bin = "";
      for (let i = 0; i < utf8Bytes.length; i++) bin += String.fromCharCode(utf8Bytes[i]);
      return "TFG1_" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function decodeTokenBase64Url(rawToken) {
      const clean = rawToken.trim().replace(/^TFG1_/, "").replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    /* ==========================================================================
       4. MOTOR ESTADÍSTICO REPRODUCIBLE (MULBERRY32, MID-RANK, WILCOXON, BH-FDR)
       ========================================================================== */
    const StatsEngine = {
      createMulberry32(seed = MONTE_CARLO_SEED) {
        let a = seed >>> 0;
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      },

      midRanksAsc(arr) {
        const indexed = arr.map((v, i) => ({ v, i })).sort((a, b) => a.v - b.v);
        const ranks = new Array(arr.length);
        let i = 0;
        while (i < indexed.length) {
          let j = i;
          while (j + 1 < indexed.length && indexed[j + 1].v === indexed[i].v) j++;
          const mid = (i + j) / 2 + 1;
          for (let k = i; k <= j; k++) ranks[indexed[k].i] = mid;
          i = j + 1;
        }
        return ranks;
      },

      midRanksDesc(arr) {
        const indexed = arr.map((v, i) => ({ v, i })).sort((a, b) => b.v - a.v);
        const ranks = new Array(arr.length);
        let i = 0;
        while (i < indexed.length) {
          let j = i;
          while (j + 1 < indexed.length && indexed[j + 1].v === indexed[i].v) j++;
          const mid = (i + j) / 2 + 1;
          for (let k = i; k <= j; k++) ranks[indexed[k].i] = mid;
          i = j + 1;
        }
        return ranks;
      },

      pearson(x, y) {
        const n = x.length;
        if (n < 3) return 0;
        const mx = x.reduce((a, b) => a + b, 0) / n;
        const my = y.reduce((a, b) => a + b, 0) / n;
        let num = 0, dx = 0, dy = 0;
        for (let i = 0; i < n; i++) {
          num += (x[i] - mx) * (y[i] - my);
          dx += (x[i] - mx) ** 2;
          dy += (y[i] - my) ** 2;
        }
        return dx * dy === 0 ? 0 : num / Math.sqrt(dx * dy);
      },

      spearmanMonteCarlo(x, y, iterations = MONTE_CARLO_ITER, seed = MONTE_CARLO_SEED) {
        const n = x.length;
        if (n < 4) return { rho: null, p: null, n };
        const rx = this.midRanksAsc(x);
        const ry = this.midRanksAsc(y);
        const rho = this.pearson(rx, ry);
        const absRho = Math.abs(rho);

        const rng = this.createMulberry32(seed);
        const perm = [...ry];
        let extreme = 0;
        for (let iter = 0; iter < iterations; iter++) {
          for (let i = perm.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [perm[i], perm[j]] = [perm[j], perm[i]];
          }
          if (Math.abs(this.pearson(rx, perm)) >= absRho - 1e-12) {
            extreme++;
          }
        }
        return {
          rho: Math.round(rho * 1000) / 1000,
          p: Math.round(((extreme + 1) / (iterations + 1)) * 10000) / 10000,
          n
        };
      },

      wilcoxonSignedRankTieCorrected(a, b) {
        const diffs = [];
        for (let i = 0; i < a.length; i++) {
          const d = b[i] - a[i];
          if (Math.abs(d) > 1e-9) diffs.push(d);
        }
        const n = diffs.length;
        if (n === 0) return { W: 0, Z: 0, p: 1, r: 0, nEff: 0 };

        const absVals = diffs.map(Math.abs);
        const ranks = this.midRanksAsc(absVals);
        let wPlus = 0, wMinus = 0;
        diffs.forEach((d, idx) => {
          if (d > 0) wPlus += ranks[idx];
          else wMinus += ranks[idx];
        });

        const sortedAbs = [...absVals].sort((x, y) => x - y);
        let tieTerm = 0;
        let idx = 0;
        while (idx < sortedAbs.length) {
          let end = idx;
          while (end + 1 < sortedAbs.length && Math.abs(sortedAbs[end + 1] - sortedAbs[idx]) < 1e-9) {
            end++;
          }
          const t = end - idx + 1;
          if (t > 1) tieTerm += (t ** 3 - t);
          idx = end + 1;
        }

        const W = Math.min(wPlus, wMinus);
        const meanW = (n * (n + 1)) / 4;
        const varW = (n * (n + 1) * (2 * n + 1) - 0.5 * tieTerm) / 24;
        const sdW = varW > 0 ? Math.sqrt(varW) : 0;
        const Z = sdW === 0 ? 0 : (wPlus - meanW) / sdW;

        const erf = (zVal) => {
          const sign = zVal >= 0 ? 1 : -1;
          const x = Math.abs(zVal);
          const t = 1 / (1 + 0.3275911 * x);
          const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
          return sign * y;
        };

        const p = Math.max(0.0001, Math.min(1, 2 * (1 - 0.5 * (1 + erf(Math.abs(Z) / Math.SQRT2)))));
        const r = Math.abs(Z) / Math.sqrt(n);

        return {
          W: Math.round(W * 10) / 10,
          Z: Math.round(Z * 100) / 100,
          p: Math.round(p * 10000) / 10000,
          r: Math.round(r * 100) / 100,
          nEff: n
        };
      },

      benjaminiHochberg(pValues) {
        const m = pValues.length;
        if (m === 0) return [];
        const indexed = pValues.map((p, i) => ({ p, i })).sort((a, b) => a.p - b.p);
        const q = new Array(m);
        let prev = 1;
        for (let k = m - 1; k >= 0; k--) {
          const adj = Math.min(prev, (indexed[k].p * m) / (k + 1));
          prev = adj;
          q[indexed[k].i] = Math.round(adj * 10000) / 10000;
        }
        return q;
      },

      jaccard(arrA, arrB) {
        const a = new Set(arrA);
        const b = new Set(arrB);
        if (a.size === 0 && b.size === 0) return 1;
        let inter = 0;
        a.forEach(x => { if (b.has(x)) inter++; });
        const union = new Set([...a, ...b]).size;
        return union === 0 ? 1 : Math.round((inter / union) * 1000) / 1000;
      },

      cronbachAlphaCompleteCases(completeRows) {
        if (!completeRows || completeRows.length < 3) return null;
        const k = completeRows[0].length;
        if (k < 2) return null;
        const itemVars = [];
        for (let j = 0; j < k; j++) {
          const col = completeRows.map(r => r[j]);
          const mean = col.reduce((a, b) => a + b, 0) / col.length;
          const v = col.reduce((s, val) => s + (val - mean) ** 2, 0) / (col.length - 1);
          itemVars.push(v);
        }
        const totals = completeRows.map(r => r.reduce((a, b) => a + b, 0));
        const meanTot = totals.reduce((a, b) => a + b, 0) / totals.length;
        const varTot = totals.reduce((s, val) => s + (val - meanTot) ** 2, 0) / (totals.length - 1);
        if (varTot === 0) return 0;
        const sumItemVar = itemVars.reduce((a, b) => a + b, 0);
        return Math.round(((k / (k - 1)) * (1 - sumItemVar / varTot)) * 1000) / 1000;
      },

      meanAndSD(vals) {
        if (!vals || vals.length === 0) return { mean: null, sd: null, n: 0 };
        const n = vals.length;
        const mean = vals.reduce((a, b) => a + b, 0) / n;
        const sd = n > 1 ? Math.sqrt(vals.reduce((s, v) => s + (v - mean) ** 2, 0) / (n - 1)) : 0;
        return {
          mean: Math.round(mean * 100) / 100,
          sd: Math.round(sd * 100) / 100,
          n
        };
      }
    };

    /* ==========================================================================
       6. CÁLCULOS ARS, PSICOMETRÍA Y CONTRASTES H1–H4
       ========================================================================== */
    function getActiveWave() {
      return AppState.data.waves.find(w => w.id === AppState.selectedWaveId) || AppState.data.waves[0];
    }

    function getActivePlayers() {
      return AppState.data.players.filter(p => p.active);
    }

    function canOpenSealedEnvelope() {
      return AppState.data.waves.length > 0 && AppState.data.waves.every(w => w.status === "closed");
    }

    function isEnvelopeOpen() {
      return Boolean(AppState.data.envelopeOpened && canOpenSealedEnvelope());

    function formatResearchNodeLabel(player, includeFullName = false) {
      if (!isEnvelopeOpen()) return player.code;
      const capTag = player.captainRank > 0 ? ` [C${player.captainRank}]` : "";
      return includeFullName
        ? `${player.code} · ${player.fullName}${capTag}`
        : `${player.code} · ${player.displayName}${capTag}`;
    }

    function computeNetworkMetrics(wave) {
      const activePlayers = getActivePlayers();
      const activeCodes = activePlayers.map(p => p.code);
      const responses = wave?.responses || {};
      const respondentCodes = Object.keys(responses).filter(c => activeCodes.includes(c));
      const nResp = respondentCodes.length;
      const nActive = activeCodes.length;

      const result = {};
      ARS_DIMENSIONS.forEach(dim => {
        const inDeg = Object.fromEntries(activeCodes.map(c => [c, 0]));
        const outDeg = Object.fromEntries(activeCodes.map(c => [c, 0]));
        const edges = [];

        respondentCodes.forEach(fromCode => {
          const targets = Array.isArray(responses[fromCode]?.[dim.key]) ? responses[fromCode][dim.key] : [];
          targets.forEach((toCode, idx) => {
            if (inDeg[toCode] !== undefined && toCode !== fromCode) {
              inDeg[toCode] += 1;
              outDeg[fromCode] += 1;
              edges.push({ from: fromCode, to: toCode, order: idx + 1 });
            }
          });
        });

        const normIn = {};
        activeCodes.forEach(c => {
          const denom = respondentCodes.includes(c) ? nResp - 1 : nResp;
          normIn[c] = denom > 0 ? Math.round((inDeg[c] / denom) * 10000) / 10000 : 0;
        });

        const valuesArr = activeCodes.map(c => normIn[c]);
        const ranksArr = StatsEngine.midRanksDesc(valuesArr);
        const rankMap = {};
        const percentileMap = {};
        activeCodes.forEach((c, idx) => {
          rankMap[c] = ranksArr[idx];
          percentileMap[c] = nActive > 0 ? Math.round(((nActive - ranksArr[idx] + 1) / nActive) * 100) : 0;
        });

        const uniqueSorted = [...new Set(valuesArr)].sort((a, b) => b - a);
        const cutoff = uniqueSorted.length >= 3 ? uniqueSorted[2] : uniqueSorted[uniqueSorted.length - 1];
        const top3Codes = cutoff > 0 ? activeCodes.filter(c => normIn[c] >= cutoff) : [];

        const maxPossibleEdges = nResp * Math.max(0, nActive - 1);
        const density = maxPossibleEdges > 0 ? Math.round((edges.length / maxPossibleEdges) * 1000) / 1000 : 0;
        const maxNorm = valuesArr.length > 0 ? Math.max(...valuesArr) : 0;
        const sumDiff = valuesArr.reduce((acc, v) => acc + (maxNorm - v), 0);
        const centralization = nActive > 1 ? Math.round((sumDiff / (nActive - 1)) * 1000) / 1000 : 0;

        result[dim.key] = {
          inDeg,
          outDeg,
          normIn,
          rankMap,
          percentileMap,
          top3Codes,
          edges,
          density,
          centralization,
          nResp,
          nActive
        };
      });

      return result;
    }

    function computeYSEQMetrics(wave) {
      const responses = wave?.responses || {};
      const taskIds = YSEQ_ITEMS.filter(i => i.sub === "task").map(i => i.id);
      const socialIds = YSEQ_ITEMS.filter(i => i.sub === "social").map(i => i.id);

      const perCode = {};
      const validTaskMeans = [];
      const validSocialMeans = [];
      const completeTaskRows = [];
      const completeSocialRows = [];
      const spuriousAlerts = [];

      Object.entries(responses).forEach(([code, resp]) => {
        const yseq = resp.yseq || {};
        const tVals = taskIds.map(id => yseq[id]).filter(v => typeof v === "number" && v >= 1 && v <= 9);
        const sVals = socialIds.map(id => yseq[id]).filter(v => typeof v === "number" && v >= 1 && v <= 9);

        const taskMean = tVals.length >= 6 ? Math.round((tVals.reduce((a, b) => a + b, 0) / tVals.length) * 100) / 100 : null;
        const socialMean = sVals.length >= 6 ? Math.round((sVals.reduce((a, b) => a + b, 0) / sVals.length) * 100) / 100 : null;

        if (taskMean !== null) validTaskMeans.push(taskMean);
        if (socialMean !== null) validSocialMeans.push(socialMean);
        if (tVals.length === 8) completeTaskRows.push(taskIds.map(id => yseq[id]));
        if (sVals.length === 8) completeSocialRows.push(socialIds.map(id => yseq[id]));

        const v9 = typeof yseq[9] === "number" ? yseq[9] : null;
        const v10 = typeof yseq[10] === "number" ? yseq[10] : null;
        const directVals = [...tVals, ...sVals];
        const directMean = directVals.length > 0 ? directVals.reduce((a, b) => a + b, 0) / directVals.length : null;
        const isAcquiescent = directMean !== null && directMean >= 6.5 && ((v9 !== null && v9 >= 6) || (v10 !== null && v10 >= 6));

        if (isAcquiescent) {
          spuriousAlerts.push({ code, directMean: Math.round(directMean * 100) / 100, v9, v10 });
        }

        perCode[code] = {
          taskCount: tVals.length,
          socialCount: sVals.length,
          taskMean,
          socialMean,
          v9,
          v10,
          isAcquiescent
        };
      });

      return {
        perCode,
        taskStats: StatsEngine.meanAndSD(validTaskMeans),
        socialStats: StatsEngine.meanAndSD(validSocialMeans),
        alphaTask: StatsEngine.cronbachAlphaCompleteCases(completeTaskRows),
        nCompleteTask: completeTaskRows.length,
        alphaSocial: StatsEngine.cronbachAlphaCompleteCases(completeSocialRows),
        nCompleteSocial: completeSocialRows.length,
        spuriousAlerts
      };
    }

    /* ==========================================================================
       7. EXPORTACIONES: SOCIOGRAMAS SVG/PNG, GEPHI GOLDEN STANDARD Y CSV/TSV
       ========================================================================== */
    function buildSociogramSVGString(wave, dimKey, netMetrics, selectedNode) {
      const size = 440;
      const cx = size / 2;
      const cy = size / 2;
      const radius = 150;
      const activePlayers = getActivePlayers();
      const dimNet = netMetrics[dimKey];
      const maxNorm = Math.max(0.01, ...activePlayers.map(p => dimNet.normIn[p.code] || 0));
      const open = isEnvelopeOpen();

      const nodes = activePlayers.map((pl, idx) => {
        const angle = (2 * Math.PI * idx) / Math.max(1, activePlayers.length) - Math.PI / 2;
        const normVal = dimNet.normIn[pl.code] || 0;
        return {
          player: pl,
          code: pl.code,
          x: cx + radius * Math.cos(angle),
          y: cy + radius * Math.sin(angle),
          inDeg: dimNet.inDeg[pl.code] || 0,
          normVal,
          r: 13 + (normVal / maxNorm) * 10
        };
      });
      const nodeMap = Object.fromEntries(nodes.map(n => [n.code, n]));

      let edgesSVG = "";
      dimNet.edges.forEach(e => {
        const s = nodeMap[e.from];
        const t = nodeMap[e.to];
        if (!s || !t) return;
        const isRelated = !selectedNode || e.from === selectedNode || e.to === selectedNode;
        const isDirect = selectedNode && (e.from === selectedNode || e.to === selectedNode);
        const dx = t.x - s.x;
        const dy = t.y - s.y;
        const dist = Math.hypot(dx, dy) || 1;
        const ux = dx / dist;
        const uy = dy / dist;
        const x1 = s.x + ux * (s.r + 2);
        const y1 = s.y + uy * (s.r + 2);
        const x2 = t.x - ux * (t.r + 5);
        const y2 = t.y - uy * (t.r + 5);
        edgesSVG += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${isDirect ? "#dc2626" : "#52525b"}" stroke-width="${isDirect ? "2.2" : "1.15"}" stroke-opacity="${isRelated ? (isDirect ? "0.95" : "0.42") : "0.08"}" marker-end="url(#${isDirect ? `arr-red-${dimKey}` : `arr-blk-${dimKey}`})" />`;
      });

      let nodesSVG = "";
      nodes.forEach(n => {
        const isSel = selectedNode === n.code;
        const isTop3 = dimNet.top3Codes.includes(n.code);
        const dimmed = selectedNode && !isSel && !dimNet.edges.some(e => (e.from === selectedNode && e.to === n.code) || (e.to === selectedNode && e.from === n.code));
        const isCap = open && n.player.captainRank > 0;
        const bottomLabel = open
          ? `${n.code} · ${n.player.displayName}${isCap ? ` [C${n.player.captainRank}]` : ""}`
          : `In:${n.inDeg}`;

        // Segre Black (#090d16) y Segre Red (#dc2626) sobre fondo blanco
        const fill = isSel ? "#dc2626" : isTop3 ? "#090d16" : "#ffffff";
        const stroke = isSel ? "#991b1b" : isTop3 ? "#dc2626" : "#090d16";
        const textFill = isSel || isTop3 ? "#ffffff" : "#090d16";

        nodesSVG += `
          <g class="socio-node" data-code="${n.code}" style="cursor:pointer;opacity:${dimmed ? "0.22" : "1"}">
            ${isCap ? `<circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${(n.r + 3.5).toFixed(1)}" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 2" />` : ""}
            <circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${n.r.toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="${isTop3 || isSel ? "2.5" : "1.5"}" />
            <text x="${n.x.toFixed(1)}" y="${(n.y + 3).toFixed(1)}" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8.5" font-weight="800" fill="${textFill}">${n.code}</text>
            <text x="${n.x.toFixed(1)}" y="${(n.y + n.r + 11).toFixed(1)}" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.6" font-weight="800" fill="${isCap ? "#dc2626" : "#090d16"}">${escapeHTML(bottomLabel)}</text>
          </g>
        `;
      });

      return `
        <svg id="svg-graph-${dimKey}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="100%" style="max-width:410px;height:auto;display:block;background:#ffffff">
          <rect x="0" y="0" width="${size}" height="${size}" fill="#ffffff" />
          <defs>
            <marker id="arr-blk-${dimKey}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
              <polygon points="0 0, 7 3.5, 0 7" fill="#52525b" />
            </marker>
            <marker id="arr-red-${dimKey}" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
              <polygon points="0 0, 8 4, 0 8" fill="#dc2626" />
            </marker>
          </defs>
          <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="#e4e4e7" stroke-width="1" stroke-dasharray="4 4" />
          ${edgesSVG}
          ${nodesSVG}
        </svg>
      `;
    }

    function downloadTextFile(filename, content, mime = "text/csv;charset=utf-8;") {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadSociogramFile(dimKey, format) {
      const wave = getActiveWave();
      const svgEl = document.getElementById(`svg-graph-${dimKey}`);
      if (!svgEl) return;
      const xml = new XMLSerializer().serializeToString(svgEl);
      const svgBlob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      if (format === "svg") {
        const a = document.createElement("a");
        a.href = url;
        a.download = `Sociograma_${wave.id}_${dimKey}_Segre.svg`;
        a.click();
        URL.revokeObjectURL(url);
        showToast(`Sociograma ${dimKey} exportado en SVG.`, "black");
      } else {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = 880;
          canvas.height = 880;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          const a = document.createElement("a");
          a.href = canvas.toDataURL("image/png");
          a.download = `Sociograma_${wave.id}_${dimKey}_PNG2x_Segre.png`;
          a.click();
          showToast(`Sociograma ${dimKey} exportado en PNG 2x sobre fondo blanco.`, "black");
        };
        img.src = url;
      }
    }

    function exportGephiGoldenStandard(wave) {
      const net = computeNetworkMetrics(wave);
      const yseq = computeYSEQMetrics(wave);
      const activePlayers = getActivePlayers();
      const open = isEnvelopeOpen();

      const nodeHeaders = [
        "Id",
        "Label",
        "Respondio",
        "InDegree_Tarea",
        "InDegree_Tarea_Norm",
        "InDegree_Motivacional",
        "InDegree_Motivacional_Norm",
        "InDegree_Social",
        "InDegree_Social_Norm",
        "YSEQ_Tarea_Media",
        "YSEQ_Social_Media"
      ];
      const nodeRows = activePlayers.map(pl => {
        const c = pl.code;
        const lbl = open ? `${c} · ${pl.displayName}${pl.captainRank > 0 ? ` [C${pl.captainRank}]` : ""}` : c;
        const resp = wave.responses && wave.responses[c] ? 1 : 0;
        const y = yseq.perCode[c] || {};
        return [
          c,
          `"${lbl}"`,
          resp,
          net.task.inDeg[c] ?? 0,
          net.task.normIn[c] ?? 0,
          net.motivational.inDeg[c] ?? 0,
          net.motivational.normIn[c] ?? 0,
          net.social.inDeg[c] ?? 0,
          net.social.normIn[c] ?? 0,
          y.taskMean ?? "",
          y.socialMean ?? ""
        ].join(",");
      });
      downloadTextFile(`Nodos_Gephi_${wave.id}.csv`, [nodeHeaders.join(","), ...nodeRows].join("\n"));

      const edgeHeaders = ["Source", "Target", "Type", "Dimension", "Order", "Weight"];
      const edgeRows = [];
      ARS_DIMENSIONS.forEach(dim => {
        net[dim.key].edges.forEach(e => {
          edgeRows.push([e.from, e.to, "Directed", dim.shortLabel, e.order, 1].join(","));
        });
      });
      setTimeout(() => {
        downloadTextFile(`Aristas_Gephi_${wave.id}.csv`, [edgeHeaders.join(","), ...edgeRows].join("\n"));
      }, 200);

      showToast(`Exportados Nodos_Gephi_${wave.id}.csv y Aristas_Gephi_${wave.id}.csv para Gephi.`, "black");
    }

        return [

          open ? `"${pl.fullName}"` : "SOBRE_CERRADO",

          net.task.percentileMap[c] ?? "",
          net.motivational.inDeg[c] ?? 0,

          min !== "" ? min : "NA",
          starts !== "" ? starts : "NA",
          passes !== "" ? passes : "NA",
          ppm
        ].join(sep);
      });

      const ext = sep === "\t" ? "tsv" : "csv";
      downloadTextFile(`TFG_Segre_U14_${wave.id}.${ext}`, [headers.join(sep), ...rows].join("\n"));
      showToast(`Exportado TFG_Segre_U14_${wave.id}.${ext} correctamente.`, "black");

    function renderMobileSurveyShell() {
      const s = AppState.surveySession;
      const wave = AppState.data.waves.find(w => w.id === s.waveId) || getActiveWave();
      const activePlayers = getActivePlayers();
      const totalSteps = 1 + 3 + YSEQ_ITEMS.length; // 0=nombre, 1..3=ARS, 4..21=YSEQ 1..18, 22=fin
      const pct = Math.min(100, Math.round((s.step / totalSteps) * 100));

      let bodyHTML = "";

      if (wave.status !== "open" && s.step === 0) {
        bodyHTML = `
          <div style="padding:26px;text-align:center;display:flex;flex-direction:column;gap:12px">
            <span class="pill pill-black" style="margin:0 auto">Estado: Oleada Cerrada</span>
            <h3 style="margin:0;font-size:1.05rem;font-weight:800">Esta oleada ya está cerrada</h3>
            <p style="margin:0;font-size:0.82rem;color:var(--segre-text-secondary)">
              La oleada <strong>${escapeHTML(wave.label)}</strong> no admite nuevas respuestas en este momento.
            </p>
          </div>
        `;
      } else if (s.step === 0) {
        // Paso 0: Selección de nombre de pila sin jugador preseleccionado y cero códigos Jxx
        bodyHTML = `
          <div style="padding:24px;display:flex;flex-direction:column;gap:14px">
            <span class="pill pill-neutral" style="width:fit-content">Identificación · Participante</span>
            <h3 style="margin:0;font-size:1.1rem;font-weight:800">Selecciona tu nombre de pila</h3>
            <p style="margin:0;font-size:0.82rem;color:var(--segre-text-secondary)">
              Elige tu nombre en el desplegable para excluirte automáticamente de la lista de compañeros. Tus respuestas son confidenciales.
            </p>
            <div>
              <label class="field-label">¿Quién eres?</label>
              <select id="sel-survey-player" style="font-size:0.95rem;font-weight:700;min-height:46px">
                <option value="" ${s.selectedPlayerId === "" ? "selected" : ""}>— Selecciona tu nombre —</option>
                ${activePlayers.map(pl => {
                  const dorsalTxt = pl.dorsal ? ` (#${pl.dorsal})` : "";
                  return `<option value="${pl.id}" ${s.selectedPlayerId === pl.id ? "selected" : ""}>${escapeHTML(pl.displayName)}${escapeHTML(dorsalTxt)}</option>`;
                }).join("")}
              </select>
            </div>
            <button type="button" class="btn btn-red" id="btn-survey-start" style="min-height:46px;font-size:0.92rem" ${!s.selectedPlayerId ? "disabled" : ""}>
              Comenzar Cuestionario →
            </button>
          </div>
        `;
      } else if (s.step >= 1 && s.step <= 3) {
        // Pasos 1-3: Nominación no forzada con botón explícito "Ninguno" y sustitución del nombre por "VOTADO"
        const dim = ARS_DIMENSIONS[s.step - 1];
        const picked = s[dim.key] || [];
        const isNoneSelected = Boolean(s[`${dim.key}None`]);

            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <span class="pill pill-red">${escapeHTML(dim.label)} (${s.step}/3)</span>
              <span class="mono" style="font-size:0.8rem;font-weight:800">

            <!-- Rejilla anti-curiosos: al votar, el nombre desaparece y pasa a mostrar exactamente "VOTADO" -->
            <div class="nomination-grid">
              ${teammates.map(tm => {
                const isVoted = picked.includes(tm.id);

                  ? "VOTADO"

                return `
                  <button type="button" class="anti-peek-btn ${isVoted ? "is-voted" : ""}" data-antipeek-vote="${dim.key}:${tm.id}">

            <div style="display:flex;gap:10px;padding-top:8px">
              <button type="button" class="btn btn-outline-black" data-survey-step="${s.step - 1}">← Atrás</button>
              <button type="button" class="btn btn-red" style="flex:1" data-survey-step="${s.step + 1}" ${!canContinue ? "disabled" : ""}>

      } else if (s.step >= 4 && s.step <= 3 + YSEQ_ITEMS.length) {
        // Pasos 4-21: YSEQ-S (18 ítems) con opción "Prefiero no contestar"
        const item = YSEQ_ITEMS[s.step - 4];
        const curVal = s.yseq[item.id]; // undefined | 1..9 | null (opt-out)
        const hasChoice = curVal !== undefined;
        const isLastItem = s.step === 3 + YSEQ_ITEMS.length;

        bodyHTML = `
          <div style="padding:24px;display:flex;flex-direction:column;gap:16px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span class="pill pill-black">Cuestionario Equipo · Frase ${item.id} de ${YSEQ_ITEMS.length}</span>
              <span class="mono" style="font-size:0.75rem;color:var(--segre-text-muted)">Escala 1 a 9</span>
            </div>

            <p style="margin:0;font-size:0.98rem;font-weight:800;line-height:1.45;min-height:54px">
              «${escapeHTML(item.text)}»
            </p>

            <div>
              <div class="likert-row">
                ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => `
                  <button type="button" class="likert-btn ${curVal === num ? "selected" : ""}" data-yseq-pick="${item.id}:${num}">${num}</button>
                `).join("")}
              </div>
              <div style="display:flex;justify-content:space-between;font-size:0.7rem;color:var(--segre-text-muted);margin-top:6px;font-weight:700">
                <span>1 = Totalmente en desacuerdo</span>
                <span>9 = Totalmente de acuerdo</span>
              </div>

              <button type="button" class="optout-btn ${curVal === null ? "selected" : ""}" data-yseq-optout="${item.id}">
                ${curVal === null ? "✓ Marcado: Prefiero no contestar a esta frase" : "Prefiero no contestar"}
              </button>
            </div>

            <div style="display:flex;gap:10px;padding-top:6px">
              <button type="button" class="btn btn-outline-black" data-survey-step="${s.step - 1}">← Atrás</button>
              ${!isLastItem ? `
                <button type="button" class="btn btn-red" style="flex:1" data-survey-step="${s.step + 1}" ${!hasChoice ? "disabled" : ""}>
                  Siguiente →
                </button>
              ` : `
                <button type="button" class="btn btn-black" style="flex:1" id="btn-submit-survey" ${!hasChoice ? "disabled" : ""}>
                  Finalizar y Enviar ✓
                </button>
              `}
            </div>
          </div>
        `;
      } else {
        bodyHTML = `
          <div style="padding:26px;display:flex;flex-direction:column;gap:14px">
            <div style="text-align:center">
              <div style="width:46px;height:46px;border-radius:14px;background:var(--segre-red);color:var(--segre-white);display:flex;align-items:center;justify-content:center;margin:0 auto 10px auto;font-size:1.35rem;font-weight:900">✓</div>
              <h3 style="margin:0;font-size:1.12rem;font-weight:800">¡Cuestionario Completado!</h3>
              <p style="margin:6px 0 0 0;font-size:0.81rem;color:var(--segre-text-secondary)">
                ${s.serverSynced
                  ? "Respuesta registrada directamente en la oleada del estudio."
                  : "El código de respuesta se ha copiado automáticamente. Envíalo al investigador para importarlo en el estudio."}
              </p>
            </div>

            <div>
              <label class="field-label">Código de Respuesta (${escapeHTML(wave.id)})</label>
              <textarea id="txt-generated-token" rows="3" readonly class="mono" style="font-size:0.75rem;background:var(--segre-canvas)">${escapeHTML(s.generatedToken)}</textarea>
            </div>

            <button type="button" class="btn btn-red" id="btn-copy-token" style="min-height:44px">
              Copiar Código de Respuesta
            </button>

            <div style="font-size:0.7rem;color:var(--segre-text-muted);text-align:center;word-break:break-all">
              Huella de integridad SHA-256: <span class="mono">${escapeHTML(s.receiptHash)}</span>
            </div>

            <button type="button" class="btn btn-outline-black" id="btn-reset-survey-session">
              Siguiente Jugador / Reiniciar Formulario
            </button>
          </div>
        `;
      }

      return `
        <div class="survey-shell">
          <div class="survey-top">
            <div>
              <div style="font-size:0.68rem;font-weight:800;text-transform:uppercase;color:#fca5a5;letter-spacing:0.04em">
                Atlètic Segre U14 · ${escapeHTML(wave.label)}
              </div>
              <div style="font-size:0.9rem;font-weight:800;margin-top:2px">Cuestionario de Liderazgo y Cohesión</div>
            </div>
            ${AppState.kioskInAppMode && !isMobileUrlMode ? `
              <button type="button" class="btn btn-red btn-sm" id="btn-close-kiosk">Salir del Kiosko</button>
            ` : ""}
          </div>
          <div class="progress-track">

          </div>
          ${bodyHTML}
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
       PESTAÑA 4: YSEQ-S Y ESTADÍSTICA (H1–H4, MONTE CARLO, WILCOXON, BH-FDR)
       -------------------------------------------------------------------------- */
    function renderPsychometricsAndStatsTab() {
      const wave = getActiveWave();
      const net = computeNetworkMetrics(wave);
      const yseq = computeYSEQMetrics(wave);
      const activePlayers = getActivePlayers();
      const activeCodes = activePlayers.map(p => p.code);
      const open = isEnvelopeOpen();

      // Suite global de contrastes inferenciales para ajuste Benjamini-Hochberg (BH-FDR)
      const suite = [];

      // H2: Centralidad normalizada vs Cohesión YSEQ-S (Tarea y Social)
      ARS_DIMENSIONS.forEach(dim => {
        ["taskMean", "socialMean"].forEach(subKey => {
          const x = [], y = [];
          activeCodes.forEach(c => {
            const val = yseq.perCode[c]?.[subKey];
            if (typeof val === "number") {
              x.push(net[dim.key].normIn[c]);
              y.push(val);
            }
          });
          const res = StatsEngine.spearmanMonteCarlo(x, y);
          if (res.rho !== null) {
            suite.push({
              hyp: "H2",
              label: `In-Degree Norm. ${dim.shortLabel} vs. YSEQ-S ${subKey === "taskMean" ? "Tarea" : "Social"} (${wave.id})`,
              stat: `ρ = ${res.rho.toFixed(3)}`,
              pRaw: res.p,
              n: res.n
            });
          }
        });
      });

      // H3: Diferenciación de redes (correlaciones entre dimensiones de liderazgo)
      [
        ["task", "motivational", "In-Degree Norm. Tarea vs. Motivacional"],
        ["task", "social", "In-Degree Norm. Tarea vs. Social"],
        ["motivational", "social", "In-Degree Norm. Motivacional vs. Social"]
      ].forEach(([d1, d2, title]) => {
        const x = activeCodes.map(c => net[d1].normIn[c]);
        const y = activeCodes.map(c => net[d2].normIn[c]);
        const res = StatsEngine.spearmanMonteCarlo(x, y);
        if (res.rho !== null) {
          suite.push({
            hyp: "H3",
            label: `${title} (${wave.id})`,
            stat: `ρ = ${res.rho.toFixed(3)}`,
            pRaw: res.p,
            n: res.n
          });
        }
      });

      // H4 Ecológico: triangulación con minutos y pases/minuto (si consentimiento ampliado verificado)
      if (AppState.data.expandedConsentVerified) {
        ARS_DIMENSIONS.forEach(dim => {
          const xMin = [], yMin = [], xPpm = [], yPpm = [];
          activePlayers.forEach(pl => {
            const eco = wave.ecological?.[pl.id];
            if (eco && Number(eco.minutes) > 0) {
              xMin.push(net[dim.key].normIn[pl.code]);
              yMin.push(Number(eco.minutes));
              if (eco.passes !== "" && eco.passes !== undefined) {
                xPpm.push(net[dim.key].normIn[pl.code]);
                yPpm.push(Number(eco.passes) / Number(eco.minutes));
              }
            }
          });
          const rMin = StatsEngine.spearmanMonteCarlo(xMin, yMin);
          if (rMin.rho !== null) {
            suite.push({
              hyp: "H4 (Eco)",
              label: `In-Degree Norm. ${dim.shortLabel} vs. Minutos Jugados (${wave.id})`,
              stat: `ρ = ${rMin.rho.toFixed(3)}`,
              pRaw: rMin.p,
              n: rMin.n
            });
          }
          const rPpm = StatsEngine.spearmanMonteCarlo(xPpm, yPpm);
          if (rPpm.rho !== null) {
            suite.push({
              hyp: "H4 (Eco)",
              label: `In-Degree Norm. ${dim.shortLabel} vs. Pases Recibidos/Min (${wave.id})`,
              stat: `ρ = ${rPpm.rho.toFixed(3)}`,
              pRaw: rPpm.p,
              n: rPpm.n
            });
          }
        });
      }

      // H4 Longitudinal: Wilcoxon pareado con corrección por empates + Jaccard + YSEQ pareado
      const waveA = AppState.data.waves.find(w => w.id === AppState.compareWaveAId) || AppState.data.waves[0];
      const waveB = AppState.data.waves.find(w => w.id === AppState.compareWaveBId) || AppState.data.waves[1] || AppState.data.waves[0];
      const canCompareLong = waveA && waveB && waveA.id !== waveB.id &&
        Object.keys(waveA.responses || {}).length >= 3 && Object.keys(waveB.responses || {}).length >= 3;

      let longNetRows = [];
      let longYSEQ = null;

      if (canCompareLong) {
        const netA = computeNetworkMetrics(waveA);
        const netB = computeNetworkMetrics(waveB);

        longNetRows = ARS_DIMENSIONS.map(dim => {
          const vecA = activeCodes.map(c => netA[dim.key].normIn[c]);
          const vecB = activeCodes.map(c => netB[dim.key].normIn[c]);
          const wil = StatsEngine.wilcoxonSignedRankTieCorrected(vecA, vecB);
          const jacEdges = StatsEngine.jaccard(
            netA[dim.key].edges.map(e => `${e.from}->${e.to}`),
            netB[dim.key].edges.map(e => `${e.from}->${e.to}`)
          );
          const jacTop3 = StatsEngine.jaccard(netA[dim.key].top3Codes, netB[dim.key].top3Codes);

          suite.push({
            hyp: "H4 (Long.)",
            label: `Estabilidad Centralidad ${dim.shortLabel}: ${waveA.id} vs. ${waveB.id} (Wilcoxon pareado)`,
            stat: `W=${wil.W}, Z=${wil.Z.toFixed(2)}`,
            pRaw: wil.p,
            n: activeCodes.length
          });

          return { dim, wil, jacEdges, jacTop3 };
        });

        const yseqA = computeYSEQMetrics(waveA);
        const yseqB = computeYSEQMetrics(waveB);
        const pTaskA = [], pTaskB = [], pSocA = [], pSocB = [];
        activeCodes.forEach(c => {
          const tA = yseqA.perCode[c]?.taskMean, tB = yseqB.perCode[c]?.taskMean;
          if (typeof tA === "number" && typeof tB === "number") { pTaskA.push(tA); pTaskB.push(tB); }
          const sA = yseqA.perCode[c]?.socialMean, sB = yseqB.perCode[c]?.socialMean;
          if (typeof sA === "number" && typeof sB === "number") { pSocA.push(sA); pSocB.push(sB); }
        });

        const wilT = StatsEngine.wilcoxonSignedRankTieCorrected(pTaskA, pTaskB);
        const wilS = StatsEngine.wilcoxonSignedRankTieCorrected(pSocA, pSocB);
        if (pTaskA.length >= 3) {
          suite.push({
            hyp: "H4 (YSEQ)",
            label: `Evolución Pareada YSEQ-S Tarea (${waveA.id} vs. ${waveB.id})`,
            stat: `W=${wilT.W}, Z=${wilT.Z.toFixed(2)}`,
            pRaw: wilT.p,
            n: pTaskA.length
          });
        }
        if (pSocA.length >= 3) {
          suite.push({
            hyp: "H4 (YSEQ)",
            label: `Evolución Pareada YSEQ-S Social (${waveA.id} vs. ${waveB.id})`,
            stat: `W=${wilS.W}, Z=${wilS.Z.toFixed(2)}`,
            pRaw: wilS.p,
            n: pSocA.length
          });
        }

        longYSEQ = {
          taskA: StatsEngine.meanAndSD(pTaskA),
          taskB: StatsEngine.meanAndSD(pTaskB),
          wilT,
          socA: StatsEngine.meanAndSD(pSocA),
          socB: StatsEngine.meanAndSD(pSocB),
          wilS
        };
      }

      const qVals = StatsEngine.benjaminiHochberg(suite.map(s => s.pRaw));
      suite.forEach((s, i) => { s.qFDR = qVals[i]; });

      const captains = activePlayers
        .filter(p => p.captainRank > 0)
        .sort((a, b) => a.captainRank - b.captainRank);

      return `
        ${renderWaveStrip()}

        <!-- DESCRIPTIVOS PSICOMÉTRICOS YSEQ-S -->
        <div class="grid-3">
          <div class="card">
            <div style="font-size:0.7rem;font-weight:800;text-transform:uppercase;color:var(--segre-text-muted)">Cohesión de Tarea (Ítems 1–8)</div>
            <div style="margin-top:8px;display:flex;align-items:baseline;gap:10px">
              <span class="mono font-black" style="font-size:1.75rem">${yseq.taskStats.mean !== null ? yseq.taskStats.mean.toFixed(2) : "—"}</span>
              <span class="mono" style="font-size:0.8rem;color:var(--segre-text-secondary)">DT = ${yseq.taskStats.sd !== null ? yseq.taskStats.sd.toFixed(2) : "—"} (n=${yseq.taskStats.n})</span>
            </div>
            <div class="mono" style="margin-top:6px;font-size:0.76rem;font-weight:800;color:var(--segre-red)">
              α Cronbach (casos completos n=${yseq.nCompleteTask}): ${yseq.alphaTask !== null ? yseq.alphaTask.toFixed(3) : "N/D (<3 completos)"}
            </div>
          </div>

          <div class="card">
            <div style="font-size:0.7rem;font-weight:800;text-transform:uppercase;color:var(--segre-text-muted)">Cohesión Social (Ítems 11–18)</div>
            <div style="margin-top:8px;display:flex;align-items:baseline;gap:10px">
              <span class="mono font-black" style="font-size:1.75rem">${yseq.socialStats.mean !== null ? yseq.socialStats.mean.toFixed(2) : "—"}</span>
              <span class="mono" style="font-size:0.8rem;color:var(--segre-text-secondary)">DT = ${yseq.socialStats.sd !== null ? yseq.socialStats.sd.toFixed(2) : "—"} (n=${yseq.socialStats.n})</span>
            </div>
            <div class="mono" style="margin-top:6px;font-size:0.76rem;font-weight:800;color:var(--segre-red)">
              α Cronbach (casos completos n=${yseq.nCompleteSocial}): ${yseq.alphaSocial !== null ? yseq.alphaSocial.toFixed(3) : "N/D (<3 completos)"}
            </div>
          </div>

          <div class="card">
            <div style="font-size:0.7rem;font-weight:800;text-transform:uppercase;color:var(--segre-text-muted)">Control Espurio (Ítems 9 y 10)</div>
            <div style="margin-top:8px;display:flex;align-items:baseline;gap:10px">
              <span class="mono font-black" style="font-size:1.75rem;color:${yseq.spuriousAlerts.length > 0 ? "var(--segre-red)" : "var(--segre-black)"}">${yseq.spuriousAlerts.length}</span>
              <span style="font-size:0.8rem;font-weight:700;color:var(--segre-text-secondary)">alertas de consistencia</span>
            </div>
            <div style="margin-top:6px;font-size:0.74rem;color:var(--segre-text-muted)">
              Cálculo solo con ≥ 75 % respondido (≥ 6/8 ítems). Cero imputación con 5.
            </div>
          </div>
        </div>

        <!-- TABLA INDIVIDUAL YSEQ-S -->
        <div class="card">
          <div class="card-header">
            <div>
              <h2 class="card-title">Puntuaciones Individuales YSEQ-S (${escapeHTML(wave.label)})</h2>
              <p class="card-subtitle">Validación española de López-Gajardo et al. (2022). Los ítems marcados como «Prefiero no contestar» no se imputan.</p>
            </div>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Participante</th>
                  <th class="text-center">Ítems Tarea (1–8)</th>
                  <th class="text-center">Media Tarea</th>
                  <th class="text-center">Ítems Social (11–18)</th>
                  <th class="text-center">Media Social</th>
                  <th class="text-center">Control 9 / 10</th>
                  <th class="text-center">Estado</th>
                </tr>
              </thead>
              <tbody>
                ${activePlayers.map(pl => {
                  const p = yseq.perCode[pl.code];
                  const label = formatResearchNodeLabel(pl, true);
                  if (!p) {
                    return `
                      <tr>
                        <td class="mono font-bold">${escapeHTML(label)}</td>
                        <td colspan="6" class="text-center" style="color:var(--segre-text-muted)">Sin cuestionario registrado en ${escapeHTML(wave.id)}</td>
                      </tr>
                    `;
                  }
                  return `
                    <tr>
