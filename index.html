    /* ==========================================================================
       9. RENDERIZADO PRINCIPAL Y DELEGACIÓN DE EVENTOS
       ========================================================================== */
    function render() {
      const root = document.getElementById("app");
      const open = isEnvelopeOpen();
      const cfg = AppState.data.config || DEFAULT_APP_CONFIG;

      let content = "";
      if (isMobileUrlMode || AppState.activeTab === "waves") {
        content = renderWavesAndSurveyTab();
      } else if (AppState.activeTab === "staff") {
        content = renderStaffTab();
      } else if (AppState.activeTab === "sociograms") {
        content = renderSociogramsTab();
      } else if (AppState.activeTab === "psych") {
        content = renderPsychometricsAndStatsTab();
      } else if (AppState.activeTab === "envelope") {
        content = renderSealedEnvelopeTab();
      } else if (AppState.activeTab === "config") {
        content = renderConfigurationTab();
      }

      root.innerHTML = `
        <header class="app-header">
          <div class="header-inner">
            <div>
              <div class="badge-row">
                <span class="pill pill-red">${escapeHTML(cfg.clubBadge)}</span>
                <span class="pill pill-black">
                  ${open ? "SOBRE CERRADO ABIERTO" : "DOBLE CIEGO ACTIVO (J01–J50)"}
                </span>
              </div>
              <h1 class="brand-title">${escapeHTML(cfg.title)}</h1>
              <p class="brand-sub">${escapeHTML(cfg.subtitle)}</p>
            </div>
          </div>
        </header>

        ${!isMobileUrlMode ? `
          <nav class="nav-bar">
            <div class="nav-inner">
              ${[
                { id: "staff", label: "1. Plantilla y Entrenadores" },
                { id: "waves", label: "2. Oleadas y QR" },
                { id: "sociograms", label: "3. Sociogramas" },
                { id: "psych", label: "4. YSEQ-S y Estadística" },
                { id: "envelope", label: "5. Sobre Cerrado" },
                { id: "config", label: "6. Configuración" }
              ].map(t => `
                <button type="button" class="tab-btn ${AppState.activeTab === t.id ? "active" : ""}" data-nav-tab="${t.id}">
                  ${escapeHTML(t.label)}
                </button>
              `).join("")}
            </div>
          </nav>
        ` : ""}

        <main class="main-container">
          ${content}
        </main>

        ${AppState.toast ? `
          <div class="toast-banner" style="background:${AppState.toast.type === "red" ? "#dc2626" : "#090d16"}">
            <span>${escapeHTML(AppState.toast.msg)}</span>
            <button type="button" id="btn-toast-close" style="background:none;border:none;color:#ffffff;font-weight:800;cursor:pointer">✕</button>
          </div>
        ` : ""}

        ${AppState.confirmDialog ? `
          <div class="modal-backdrop">
            <div class="modal-dialog">
              <h3 style="margin:0 0 8px 0;font-size:1rem;font-weight:800">${escapeHTML(AppState.confirmDialog.title)}</h3>
              <p style="margin:0 0 18px 0;font-size:0.82rem;color:var(--segre-text-secondary)">${escapeHTML(AppState.confirmDialog.message)}</p>
              <div style="display:flex;justify-content:flex-end;gap:8px">
                <button type="button" class="btn btn-outline-black" id="btn-modal-cancel">Cancelar</button>
                <button type="button" class="btn ${AppState.confirmDialog.isRed ? "btn-red" : "btn-black"}" id="btn-modal-confirm">${escapeHTML(AppState.confirmDialog.confirmLabel)}</button>
              </div>
            </div>
          </div>
        ` : ""}
      `;

      bindEvents();
    }

    function bindEvents() {
      // Navegación 6 pestañas
      document.querySelectorAll("[data-nav-tab]").forEach(btn => {
        btn.onclick = () => {
          AppState.activeTab = btn.getAttribute("data-nav-tab");
          if (AppState.activeTab === "config") {
            AppState.configDraft = { ...AppState.data.config };
          }
          render();
        };
      });

      // Selector de oleada activa
      document.querySelectorAll("[data-select-wave]").forEach(btn => {
        btn.onclick = () => {
          AppState.selectedWaveId = btn.getAttribute("data-select-wave");
          AppState.surveySession.waveId = AppState.selectedWaveId;
          AppState.selectedGraphNode = null;
          render();
        };
      });

      // Exportaciones globales de barra
      const btnGephi = document.getElementById("btn-export-gephi");
      if (btnGephi) btnGephi.onclick = () => exportGephiGoldenStandard(getActiveWave());
      const btnCsv = document.getElementById("btn-export-csv");
      if (btnCsv) btnCsv.onclick = () => exportFullStatisticalTable(getActiveWave(), ",");
      const btnTsv = document.getElementById("btn-export-tsv");
      if (btnTsv) btnTsv.onclick = () => exportFullStatisticalTable(getActiveWave(), "\t");

      // Pestaña 1: Plantilla y Entrenadores
      const formAddPlayer = document.getElementById("form-add-player");
      if (formAddPlayer) {
        formAddPlayer.onsubmit = (e) => {
          e.preventDefault();
          const fullName = document.getElementById("inp-add-fullname").value.trim();
          const displayName = document.getElementById("inp-add-displayname").value.trim();
          const dorsal = document.getElementById("inp-add-dorsal").value.trim();
          if (!fullName || !displayName) return;
          if (getActivePlayers().length >= MAX_PLAYERS) {
            showToast(`Máximo de ${MAX_PLAYERS} jugadores alcanzado.`, "red");
            return;
          }
          const usedAndRetired = new Set([
            ...AppState.data.players.map(p => p.code),
            ...(AppState.data.retiredCodes || [])
          ]);
          const freeCodes = ALL_CODE_POOL.filter(c => !usedAndRetired.has(c));
          if (freeCodes.length === 0) {
            showToast("No quedan códigos aleatorios disponibles en J01–J50.", "red");
            return;
          }
          const assignedCode = cryptoShuffle(freeCodes)[0];
          AppState.data.players.push({
            id: `P_${Date.now()}`,
            fullName,
            displayName,
            dorsal,
            dob: "",
            code: assignedCode,
            captainRank: 0,
            active: true
          });
          persistState();
          showToast(`Jugador «${fullName}» añadido con código interno oculto.`, "black");
          render();
        };
      }

      document.querySelectorAll("[data-edit-full]").forEach(inp => {
        inp.onchange = () => {
          const id = inp.getAttribute("data-edit-full");
          const val = inp.value.trim();
          if (!val) return;
          AppState.data.players = AppState.data.players.map(p => p.id === id ? { ...p, fullName: val } : p);
          persistState();
        };
      });

      document.querySelectorAll("[data-edit-display]").forEach(inp => {
        inp.onchange = () => {
          const id = inp.getAttribute("data-edit-display");
          const val = inp.value.trim();
          if (!val) return;
          AppState.data.players = AppState.data.players.map(p => p.id === id ? { ...p, displayName: val } : p);
          persistState();
        };
      });

      document.querySelectorAll("[data-edit-dorsal]").forEach(inp => {
        inp.onchange = () => {
          const id = inp.getAttribute("data-edit-dorsal");
          const val = inp.value.trim();
          AppState.data.players = AppState.data.players.map(p => p.id === id ? { ...p, dorsal: val } : p);
          persistState();
        };
      });

      document.querySelectorAll("[data-edit-captain]").forEach(sel => {
        sel.onchange = () => {
          const id = sel.getAttribute("data-edit-captain");
          const rank = Number(sel.value);
          if (rank > 0 && AppState.data.players.some(p => p.active && p.id !== id && p.captainRank === rank)) {
            showToast(`Ya existe otro jugador asignado como ${rank}.º Capitán.`, "red");
            render();
            return;
          }
          AppState.data.players = AppState.data.players.map(p => p.id === id ? { ...p, captainRank: rank } : p);
          persistState();
          render();
        };
      });

      document.querySelectorAll("[data-retire-id]").forEach(btn => {
        btn.onclick = () => {
          const id = btn.getAttribute("data-retire-id");
          const pl = AppState.data.players.find(p => p.id === id);
          if (!pl) return;
          openConfirm(
            "Confirmar baja definitiva",
            `¿Dar de baja a ${pl.fullName}? Su código aleatorio interno quedará retirado permanentemente y nunca será reasignado a un jugador nuevo.`,
            () => {
              AppState.data.players = AppState.data.players.map(p => p.id === id ? { ...p, active: false, captainRank: 0 } : p);
              if (!AppState.data.retiredCodes.includes(pl.code)) {
                AppState.data.retiredCodes.push(pl.code);
              }
              persistState();
              showToast(`Baja definitiva registrada para ${pl.fullName}.`, "black");
              render();
            },
            "Confirmar Baja",
            true
          );
        };
      });

      // Predicciones ciegas entrenadores
      document.querySelectorAll("[data-coach-tab]").forEach(btn => {
        btn.onclick = () => {
          AppState.coachDraft.coachNum = Number(btn.getAttribute("data-coach-tab"));
          AppState.coachDraft.task = [];
          AppState.coachDraft.motivational = [];
          AppState.coachDraft.social = [];
          render();
        };
      });

      document.querySelectorAll("[data-coach-pick]").forEach(btn => {
        btn.onclick = () => {
          const [dimKey, pid] = btn.getAttribute("data-coach-pick").split(":");
          const cur = AppState.coachDraft[dimKey] || [];
          if (cur.includes(pid)) {
            AppState.coachDraft[dimKey] = cur.filter(x => x !== pid);
          } else if (cur.length < 3) {
            AppState.coachDraft[dimKey] = [...cur, pid];
          }
          render();
        };
      });

      const btnSealCoach = document.getElementById("btn-seal-coach-pred");
      if (btnSealCoach) {
        btnSealCoach.onclick = async () => {
          const wave = getActiveWave();
          const cNum = AppState.coachDraft.coachNum;
          const payload = {
            task: [...AppState.coachDraft.task],
            motivational: [...AppState.coachDraft.motivational],
            social: [...AppState.coachDraft.social],
            submittedAt: new Date().toISOString()
          };
          payload.sha256 = await computeSHA256(JSON.stringify({ waveId: wave.id, cNum, ...payload }));
          AppState.data.waves = AppState.data.waves.map(w => {
            if (w.id !== wave.id) return w;
            return cNum === 1 ? { ...w, coach1Blind: payload } : { ...w, coach2Blind: payload };
          });
          AppState.coachDraft.task = [];
          AppState.coachDraft.motivational = [];
          AppState.coachDraft.social = [];
          persistState();
          showToast(`Predicción ciega del ${cNum === 1 ? "1.º" : "2.º"} Entrenador sellada con SHA-256.`, "black");
          render();
        };
      }

      // Consentimiento ampliado y variables ecológicas
      const chkConsent = document.getElementById("chk-expanded-consent");
      if (chkConsent) {
        chkConsent.onchange = () => {
          AppState.data.expandedConsentVerified = chkConsent.checked;
          persistState();
          render();
        };
      }

      document.querySelectorAll("[data-eco]").forEach(inp => {
        inp.onchange = () => {
          const [field, pid] = inp.getAttribute("data-eco").split(":");
          const val = inp.value === "" ? "" : Math.max(0, Number(inp.value) || 0);
          const wave = getActiveWave();
          AppState.data.waves = AppState.data.waves.map(w => {
            if (w.id !== wave.id) return w;
            const prev = w.ecological?.[pid] || { minutes: "", starts: "", passes: "" };
            return { ...w, ecological: { ...w.ecological, [pid]: { ...prev, [field]: val } } };
          });
          persistState();
          render();
        };
      });

      // Pestaña 2: Oleadas y QR (Edición directa de Denominación y Momento)
      document.querySelectorAll("[data-edit-wave-label]").forEach(inp => {
        inp.oninput = () => {
          const wId = inp.getAttribute("data-edit-wave-label");
          AppState.data.waves = AppState.data.waves.map(w => w.id === wId ? { ...w, label: inp.value } : w);
          persistState();
        };
      });

      document.querySelectorAll("[data-edit-wave-period]").forEach(inp => {
        inp.oninput = () => {
          const wId = inp.getAttribute("data-edit-wave-period");
          AppState.data.waves = AppState.data.waves.map(w => w.id === wId ? { ...w, period: inp.value } : w);
          persistState();
        };
      });

      const btnAddWave = document.getElementById("btn-add-wave");
      if (btnAddWave) {
        btnAddWave.onclick = () => {
          const existingNums = AppState.data.waves.map(w => Number(String(w.id).replace(/\D/g, "")) || 0);
          const nextNum = Math.max(AppState.data.nextWaveSeq || 4, ...existingNums) + (existingNums.includes(AppState.data.nextWaveSeq) ? 1 : 0);
          const id = `T${nextNum}`;
          AppState.data.nextWaveSeq = nextNum + 1;
          AppState.data.waves.push({
            id,
            label: `Oleada ${id} — Toma Adicional`,
            period: "Fecha / Momento a definir",
            status: "open",
            coach1Blind: null,
            coach2Blind: null,
            responses: {},
            ecological: {}
          });
          AppState.data.envelopeOpened = false;
          AppState.selectedWaveId = id;
          persistState();
          showToast(`Oleada ${id} añadida. Puedes editar su denominación y momento directamente.`, "black");
          render();
        };
      }

      document.querySelectorAll("[data-toggle-wave-status]").forEach(btn => {
        btn.onclick = () => {
          const wId = btn.getAttribute("data-toggle-wave-status");
          AppState.data.waves = AppState.data.waves.map(w => {
            if (w.id !== wId) return w;
            const nextStatus = w.status === "closed" ? "open" : "closed";
            return { ...w, status: nextStatus };
          });
          if (!canOpenSealedEnvelope()) AppState.data.envelopeOpened = false;
          persistState();
          render();
        };
      });

      document.querySelectorAll("[data-gephi-wave]").forEach(btn => {
        btn.onclick = () => {
          const wId = btn.getAttribute("data-gephi-wave");
          const w = AppState.data.waves.find(x => x.id === wId);
          if (w) exportGephiGoldenStandard(w);
        };
      });

      document.querySelectorAll("[data-del-wave]").forEach(btn => {
        btn.onclick = () => {
          const wId = btn.getAttribute("data-del-wave");
          openConfirm(
            `Eliminar oleada ${wId}`,
            `¿Seguro que deseas eliminar ${wId}? Los identificadores futuros no reutilizarán ${wId}.`,
            () => {
              AppState.data.waves = AppState.data.waves.filter(w => w.id !== wId);
              if (AppState.selectedWaveId === wId) AppState.selectedWaveId = AppState.data.waves[0]?.id || "T1";
              persistState();
              render();
            }
          );
        };
      });

      // QR local
      const inpQrBase = document.getElementById("inp-qr-base-url");
      if (inpQrBase) {
        inpQrBase.oninput = () => {
          AppState.qrBaseUrlInput = inpQrBase.value;
          const wave = getActiveWave();
          const clean = AppState.qrBaseUrlInput.trim().replace(/\/+$/, "");
          const url = clean
            ? `${clean}?modo=encuesta&w=${encodeURIComponent(wave.id)}`
            : `${window.location.origin}${window.location.pathname}?modo=encuesta&w=${encodeURIComponent(wave.id)}`;
          const card = inpQrBase.closest(".card");
          if (card) {
            const svgWrap = card.querySelector("svg")?.parentElement;
            if (svgWrap) svgWrap.innerHTML = OfflineQR.toSVG(url, 160);
            const spanUrl = document.getElementById("lbl-qr-scan-url");
            if (spanUrl) spanUrl.textContent = url;
          }
        };
      }

      const btnCopyScanUrl = document.getElementById("btn-copy-scan-url");
      if (btnCopyScanUrl) {
        btnCopyScanUrl.onclick = () => {
          const wave = getActiveWave();
          const clean = AppState.qrBaseUrlInput.trim().replace(/\/+$/, "");
          const url = clean
            ? `${clean}?modo=encuesta&w=${encodeURIComponent(wave.id)}`
            : `${window.location.origin}${window.location.pathname}?modo=encuesta&w=${encodeURIComponent(wave.id)}`;
          copyTextSafely(url);
          showToast("Enlace de encuesta copiado al portapapeles.", "black");
        };
      }

      document.querySelectorAll("[data-kiosk-wave]").forEach(btn => {
        btn.onclick = () => {
          const wId = btn.getAttribute("data-kiosk-wave");
          AppState.selectedWaveId = wId;
          AppState.kioskInAppMode = true;
          AppState.surveySession = {
            waveId: wId,
            selectedPlayerId: "",
            step: 0,
            task: [],
            taskNone: false,
            motivational: [],
            motivationalNone: false,
            social: [],
            socialNone: false,
            yseq: {},
            generatedToken: "",
            receiptHash: "",
            serverSynced: false
          };
          render();
        };
      });

      const btnCloseKiosk = document.getElementById("btn-close-kiosk");
      if (btnCloseKiosk) {
        btnCloseKiosk.onclick = () => {
          AppState.kioskInAppMode = false;
          render();
        };
      }

      // Importador de tokens con confirmación antes de sobrescribir
      const formImportTokens = document.getElementById("form-import-tokens");
      if (formImportTokens) {
        formImportTokens.onsubmit = (e) => {
          e.preventDefault();
          const rawBox = document.getElementById("txt-import-tokens").value.trim();
          if (!rawBox) return;
          const lines = rawBox.split(/\s+/).filter(Boolean);
          const idToCode = Object.fromEntries(AppState.data.players.map(p => [p.id, p.code]));
          const nameToCode = Object.fromEntries(AppState.data.players.map(p => [p.displayName.toLowerCase(), p.code]));

          const pendingFresh = [];
          const pendingOverwrite = [];
          let invalidCount = 0;

          lines.forEach(tok => {
            try {
              const obj = decodeTokenBase64Url(tok);
              if (!obj || obj.v !== 1 || !obj.w) { invalidCount++; return; }
              const targetWave = AppState.data.waves.find(w => w.id === obj.w);
              if (!targetWave) { invalidCount++; return; }

              const senderCode = idToCode[obj.p] || nameToCode[String(obj.n || "").toLowerCase()];
              if (!senderCode) { invalidCount++; return; }

              const mapList = (arr) => (Array.isArray(arr) ? arr : [])
                .map(x => idToCode[x] || nameToCode[String(x).toLowerCase()])
                .filter(c => c && c !== senderCode);

              const record = {
                waveId: targetWave.id,
                senderCode,
                response: {
                  task: mapList(obj.t),
                  motivational: mapList(obj.m),
                  social: mapList(obj.s),
                  yseq: obj.y || {},
                  submittedAt: obj.ts || new Date().toISOString(),
                  sha256: obj.h || ""
                }
              };

              if (targetWave.responses && targetWave.responses[senderCode]) {
                pendingOverwrite.push(record);
              } else {
                pendingFresh.push(record);
              }
            } catch (_) {
              invalidCount++;
            }
          });

          const applyRecords = (list) => {
            list.forEach(item => {
              const w = AppState.data.waves.find(x => x.id === item.waveId);
              if (w) {
                w.responses = { ...w.responses, [item.senderCode]: item.response };
              }
            });
            persistState();
          };

          if (pendingFresh.length > 0) {
            applyRecords(pendingFresh);
          }
          document.getElementById("txt-import-tokens").value = "";

          if (pendingOverwrite.length > 0) {
            openConfirm(
              "Respuesta ya registrada en la oleada",
              `Se han detectado ${pendingOverwrite.length} respuesta(s) de jugador(es) que ya habían respondido en esa oleada. ¿Deseas sobrescribirlas con los nuevos datos?`,
              () => {
                applyRecords(pendingOverwrite);
                showToast(`Importadas ${pendingFresh.length + pendingOverwrite.length} respuestas en total.`, "black");
                render();
              },
              "Sobrescribir Respuestas",
              true
            );
          } else {
            showToast(
              `Importación completada: ${pendingFresh.length} respuesta(s) registrada(s)${invalidCount ? `, ${invalidCount} token(s) inválido(s)` : ""}.`,
              pendingFresh.length > 0 ? "black" : "red"
            );
            render();
          }
        };
      }

      // Eventos de Encuesta Móvil / Modo Kiosko
      const selSurveyPlayer = document.getElementById("sel-survey-player");
      if (selSurveyPlayer) {
        selSurveyPlayer.onchange = () => {
          AppState.surveySession.selectedPlayerId = selSurveyPlayer.value;
          render();
        };
      }

      const btnSurveyStart = document.getElementById("btn-survey-start");
      if (btnSurveyStart) {
        btnSurveyStart.onclick = () => {
          if (!AppState.surveySession.selectedPlayerId) return;
          AppState.surveySession.step = 1;
          render();
        };
      }

      // Botón explícito "Ninguno"
      document.querySelectorAll("[data-antipeek-none]").forEach(btn => {
        btn.onclick = () => {
          const dimKey = btn.getAttribute("data-antipeek-none");
          const nextVal = !AppState.surveySession[`${dimKey}None`];
          AppState.surveySession[`${dimKey}None`] = nextVal;
          if (nextVal) {
            AppState.surveySession[dimKey] = [];
          }
          render();
        };
      });

      // Votación Anti-Peeking ("VOTADO" sustituye al nombre del compañero)
      document.querySelectorAll("[data-antipeek-vote]").forEach(btn => {
        btn.onclick = () => {
          const [dimKey, tmId] = btn.getAttribute("data-antipeek-vote").split(":");
          const cur = AppState.surveySession[dimKey] || [];
          if (cur.includes(tmId)) {
            AppState.surveySession[dimKey] = cur.filter(x => x !== tmId);
          } else if (cur.length < 3) {
            AppState.surveySession[`${dimKey}None`] = false;
            AppState.surveySession[dimKey] = [...cur, tmId];
          }
          render();
        };
      });

      document.querySelectorAll("[data-survey-step]").forEach(btn => {
        btn.onclick = () => {
          AppState.surveySession.step = Number(btn.getAttribute("data-survey-step"));
          render();
        };
      });

      document.querySelectorAll("[data-yseq-pick]").forEach(btn => {
        btn.onclick = () => {
          const [qId, val] = btn.getAttribute("data-yseq-pick").split(":");
          AppState.surveySession.yseq[Number(qId)] = Number(val);
          render();
        };
      });

      document.querySelectorAll("[data-yseq-optout]").forEach(btn => {
        btn.onclick = () => {
          const qId = Number(btn.getAttribute("data-yseq-optout"));
          AppState.surveySession.yseq[qId] = null;
          render();
        };
      });

      const btnSubmitSurvey = document.getElementById("btn-submit-survey");
      if (btnSubmitSurvey) {
        btnSubmitSurvey.onclick = async () => {
          const s = AppState.surveySession;
          const wave = AppState.data.waves.find(w => w.id === s.waveId) || getActiveWave();
          const senderPlayer = AppState.data.players.find(p => p.id === s.selectedPlayerId);
          if (!senderPlayer) return;

          const ts = new Date().toISOString();
          const rawPayload = {
            v: 1,
            w: wave.id,
            p: senderPlayer.id,
            n: senderPlayer.displayName,
            t: s.taskNone ? [] : [...s.task],
            m: s.motivationalNone ? [] : [...s.motivational],
            s: s.socialNone ? [] : [...s.social],
            y: { ...s.yseq },
            ts
          };
          const hash = await computeSHA256(JSON.stringify(rawPayload));
          rawPayload.h = hash;
          const token = encodeTokenBase64Url(rawPayload);

          const finalizeCompletion = (savedLocally) => {
            copyTextSafely(token);
            s.generatedToken = token;
            s.receiptHash = hash;
            s.serverSynced = savedLocally;
            s.step = 4 + YSEQ_ITEMS.length;
            render();
          };

          // Si se ejecuta en Modo Kiosko dentro del dispositivo anfitrión, guarda directamente (con confirmación si ya existía)
          if (!isMobileUrlMode && AppState.kioskInAppMode) {
            const idToCode = Object.fromEntries(AppState.data.players.map(p => [p.id, p.code]));
            const senderCode = senderPlayer.code;
            const saveLocalResponse = () => {
              wave.responses = {
                ...wave.responses,
                [senderCode]: {
                  task: (s.taskNone ? [] : s.task).map(id => idToCode[id]).filter(c => c && c !== senderCode),
                  motivational: (s.motivationalNone ? [] : s.motivational).map(id => idToCode[id]).filter(c => c && c !== senderCode),
                  social: (s.socialNone ? [] : s.social).map(id => idToCode[id]).filter(c => c && c !== senderCode),
                  yseq: { ...s.yseq },
                  submittedAt: ts,
                  sha256: hash
                }
              };
              persistState();
              finalizeCompletion(true);
            };

            if (wave.responses && wave.responses[senderCode]) {
              openConfirm(
                "Respuesta duplicada detectada",
                `${senderPlayer.displayName} ya tiene una respuesta registrada en ${wave.id}. ¿Deseas sobrescribirla con este nuevo cuestionario?`,
                saveLocalResponse,
                "Sobrescribir",
                true
              );
              return;
            }
            saveLocalResponse();
            return;
          }

          finalizeCompletion(false);
        };
      }

      const btnCopyToken = document.getElementById("btn-copy-token");
      if (btnCopyToken) {
        btnCopyToken.onclick = () => {
          copyTextSafely(AppState.surveySession.generatedToken);
          showToast("Código de respuesta copiado al portapapeles.", "black");
        };
      }

      const btnResetSurveySession = document.getElementById("btn-reset-survey-session");
      if (btnResetSurveySession) {
        btnResetSurveySession.onclick = () => {
          AppState.surveySession = {
            waveId: AppState.surveySession.waveId,
            selectedPlayerId: "",
            step: 0,
            task: [],
            taskNone: false,
            motivational: [],
            motivationalNone: false,
            social: [],
            socialNone: false,
            yseq: {},
            generatedToken: "",
            receiptHash: "",
            serverSynced: false
          };
          render();
        };
      }

      // Pestaña 3: Sociogramas
      document.querySelectorAll(".socio-node").forEach(node => {
        node.onclick = () => {
          const c = node.getAttribute("data-code");
          AppState.selectedGraphNode = AppState.selectedGraphNode === c ? null : c;
          render();
        };
      });

      const btnClearNode = document.getElementById("btn-clear-graph-node");
      if (btnClearNode) {
        btnClearNode.onclick = () => {
          AppState.selectedGraphNode = null;
          render();
        };
      }

      document.querySelectorAll("[data-graph-dl]").forEach(btn => {
        btn.onclick = () => {
          const [dimKey, fmt] = btn.getAttribute("data-graph-dl").split(":");
          downloadSociogramFile(dimKey, fmt);
        };
      });

      // Pestaña 4: Selectores longitudinales
      const selLongA = document.getElementById("sel-long-a");
      if (selLongA) {
        selLongA.onchange = () => {
          AppState.compareWaveAId = selLongA.value;
          render();
        };
      }
      const selLongB = document.getElementById("sel-long-b");
      if (selLongB) {
        selLongB.onchange = () => {
          AppState.compareWaveBId = selLongB.value;
          render();
        };
      }

      // Pestaña 5: Sobre Cerrado Definitivo
      const btnOpenEnvelope = document.getElementById("btn-open-sealed-envelope");
      if (btnOpenEnvelope) {
        btnOpenEnvelope.onclick = () => {
          if (!canOpenSealedEnvelope()) {
            showToast("Debes cerrar todas las oleadas del estudio antes de abrir el Sobre Cerrado.", "red");
            return;
          }
          openConfirm(
            "Abrir Sobre Cerrado Definitivo",
            "Todas las oleadas están cerradas. ¿Confirmas la apertura definitiva del Sobre Cerrado para revelar los nombres reales junto a los códigos J01–J50 en todos los sociogramas y tablas?",
            () => {
              AppState.data.envelopeOpened = true;
              persistState();
              showToast("Sobre Cerrado abierto: los sociogramas y tablas muestran ahora nombres junto a códigos.", "black");
              render();
            },
            "Abrir Sobre Cerrado",
            true
          );
        };
      }

      // Pestaña 6: Configuración y Respaldo JSON
      const formAppConfig = document.getElementById("form-app-config");
      if (formAppConfig) {
        formAppConfig.onsubmit = (e) => {
          e.preventDefault();
          const title = document.getElementById("cfg-title").value.trim();
          const subtitle = document.getElementById("cfg-subtitle").value.trim();
          const clubBadge = document.getElementById("cfg-badge").value.trim();
          if (!title || !subtitle || !clubBadge) return;
          AppState.data.config = { title, subtitle, clubBadge };
          AppState.configDraft = { ...AppState.data.config };
          persistState();
          showToast("Configuración guardada y actualizada en el encabezado.", "black");
          render();
        };
      }

      const btnResetDefaultConfig = document.getElementById("btn-reset-default-config");
      if (btnResetDefaultConfig) {
        btnResetDefaultConfig.onclick = () => {
          AppState.data.config = { ...DEFAULT_APP_CONFIG };
          AppState.configDraft = { ...DEFAULT_APP_CONFIG };
          persistState();
          showToast("Valores por defecto restaurados.", "black");
          render();
        };
      }

      const btnBackup = document.getElementById("btn-backup-json");
      if (btnBackup) {
        btnBackup.onclick = () => {
          downloadTextFile(
            `Respaldo_TFG_Segre_U14_${new Date().toISOString().slice(0, 10)}.json`,
            JSON.stringify(AppState.data, null, 2),
            "application/json"
          );
          showToast("Respaldo JSON descargado correctamente.", "black");
        };
      }

      const inpRestore = document.getElementById("inp-restore-json");
      if (inpRestore) {
        inpRestore.onchange = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = JSON.parse(ev.target.result);
              if (!Array.isArray(parsed.players) || !Array.isArray(parsed.waves)) {
                showToast("Archivo JSON no válido.", "red");
                return;
              }
              parsed.config = { ...DEFAULT_APP_CONFIG, ...(parsed.config || {}) };
              AppState.data = parsed;
              AppState.configDraft = { ...parsed.config };
              persistState();
              showToast("Estudio restaurado desde copia JSON.", "black");
              render();
            } catch (_) {
              showToast("No se pudo leer el archivo JSON.", "red");
            }
          };
          reader.readAsText(file);
        };
      }

      // Toast y Modal
      const btnToastClose = document.getElementById("btn-toast-close");
      if (btnToastClose) btnToastClose.onclick = () => { AppState.toast = null; render(); };

      const btnModalCancel = document.getElementById("btn-modal-cancel");
      if (btnModalCancel) btnModalCancel.onclick = () => { AppState.confirmDialog = null; render(); };

      const btnModalConfirm = document.getElementById("btn-modal-confirm");
      if (btnModalConfirm) {
        btnModalConfirm.onclick = () => {
          const fn = AppState.confirmDialog?.onConfirm;
          AppState.confirmDialog = null;
          if (fn) fn();
          render();
        };
      }
    }

    render();
  </script>
</body>
</html>
